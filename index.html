    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Noto Serif SC","Songti SC",Georgia,serif;color:var(--ink)}
    body{min-height:100vh;display:grid;place-items:center;padding:28px 18px;background:radial-gradient(circle at 12% 10%,#fff9ed 0,transparent 33%),radial-gradient(circle at 86% 85%,#e7c99f66 0,transparent 38%),linear-gradient(145deg,#efe0c9,#fbf5ec 52%,#e9d3b3)}
    .card{position:relative;width:min(680px,100%);padding:clamp(34px,7vw,72px) clamp(24px,7vw,68px);overflow:hidden;text-align:center;background:rgba(255,253,248,.94);border:1px solid #d9b98e;border-radius:28px;box-shadow:0 24px 70px #6b46252e,0 3px 12px #6b46251c}
    .card:before,.card:after{content:"";position:absolute;width:180px;height:180px;border:1px solid #d6ad7744;border-radius:50%}.card:before{left:-110px;top:-105px}.card:after{right:-105px;bottom:-115px}
    .mark{width:92px;height:92px;margin:0 auto 22px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(145deg,#8d5b37,#5d3823);box-shadow:0 12px 28px #6b46253d}
    .eyebrow{margin:0 0 10px;color:#9b6e42;font-size:12px;letter-spacing:.28em;text-transform:uppercase}.zh{margin:0;font-size:clamp(30px,7vw,48px);font-weight:700;letter-spacing:.06em}.en{margin:8px 0 24px;color:#9a7d66;font-family:Georgia,serif;font-size:clamp(14px,3vw,18px);font-style:italic;letter-spacing:.08em}
    .line{width:64px;height:2px;margin:0 auto 24px;background:linear-gradient(90deg,transparent,var(--wheat),transparent)}
    .copy{max-width:480px;margin:0 auto 30px;color:var(--muted);font-size:15px;line-height:1.9}.copy strong{color:var(--brown)}
    .go{position:relative;z-index:2;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:14px 30px;color:#fff;text-decoration:none;font-weight:700;letter-spacing:.04em;background:linear-gradient(135deg,#8d5b37,#643c25);border:1px solid #58321e;border-radius:999px;box-shadow:0 10px 24px #7146284a;transition:.2s transform,.2s box-shadow}.go:hover{transform:translateY(-2px);box-shadow:0 14px 30px #71462855}.go:active{transform:translateY(0)}
    .url{margin:18px auto 0;color:#9b8979;font:11px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere}.foot{margin:34px 0 0;color:#aa9888;font-size:10px;letter-spacing:.1em}
  </style>
</head>
<body>
  <main class="card">

    </div>
    <p class="eyebrow">MaiRiJi · Notice</p>
    <h1 class="zh">官网搬家了</h1>
    <p class="en">Our bakery diary has a new home</p>
    <div class="line"></div>
    <p class="copy">为了带来更稳定、更安心的订购体验，<strong>麦日记官网已迁移至新地址</strong>。感谢你一路陪伴，面包的香气和我们的故事都在新家继续。</p>
    <a class="go" href="https://mairiji-website.mairiji.workers.dev/" rel="noopener">进入麦日记新官网 <span aria-hidden="true">→</span></a>
    <p class="url">mairiji-website.mairiji.workers.dev</p>
    <p class="foot">旧站迁移公告 v1.0.0 · 2026-09-07</p>
  </main>
  <script>
    /* 旧站曾安装PWA；迁移公告加载后撤销旧Service Worker和旧缓存，避免继续打开旧商城。 */
    try{if('serviceWorker'in navigator)navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})});if('caches'in window)caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k)})})}catch(e){}
  </script>
</body>
</html>
